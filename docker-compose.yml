services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/app/backend/data
      - REGISTRATION_MODE=invite
      - DEFAULT_ADMIN_USER=stock-agent
      - DEFAULT_ADMIN_PASSWORD=sg123456
      - TZ=Asia/Shanghai
    volumes:
      - stock_agent_data:/app/backend/data
    depends_on:
      - akshare-mcp

  akshare-mcp:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    environment:
      - TZ=Asia/Shanghai
    expose:
      - "8000"
    # Exposed on the compose network as http://akshare-mcp:8000 (the akshare-data plugin default).

volumes:
  stock_agent_data:
