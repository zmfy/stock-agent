services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/app/backend/data
      - REGISTRATION_MODE=invite
      - DEFAULT_ADMIN_USER=stock-agent
      - DEFAULT_ADMIN_PASSWORD=sg123456
    volumes:
      - stock_agent_data:/app/backend/data

volumes:
  stock_agent_data:
